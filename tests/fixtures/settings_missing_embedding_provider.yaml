llm:
  provider: "openai"
  model: "gpt-4o"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""
  base_url: ""
  temperature: 0.0
  max_tokens: 4096

embedding:
  model: "text-embedding-ada-002"
  dimensions: 1536
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: ""

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: ""
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true
